name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest
      - name: Run lint
        run: uv run ruff check .
